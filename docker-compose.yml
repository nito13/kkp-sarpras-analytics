services:
  # -------------------------------------------------------------
  # Layanan Web Server SIM-SARPRAS KKP (Laravel 10 + PHP 8.2 Apache)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kkp-sarpras-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-base64:P8JsI8D4Dpu6oQM209+qmXnBWQZZKFiO1ZwjXT2Fyds=}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-kkp_sarpras_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kkp-network

  # -------------------------------------------------------------
  # Layanan Basis Data Relasional (MySQL 8.0)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: kkp-sarpras-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-kkp_sarpras_db}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kkp-network

  # -------------------------------------------------------------
  # Layanan phpMyAdmin (GUI Database Web)
  # -------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kkp-sarpras-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kkp-network

volumes:
  db_data:
    name: kkp_sarpras_db_data

networks:
  kkp-network:
    name: kkp-sarpras-network
    driver: bridge
